    <!-- Principal conteúdo da página -->
   <container class="my-5">
     <h2 class="mb-4 text-center">Entre em Contato</h2>
        
        <!-- Alerta de Sucesso (inicialmente oculto) -->
        <div id="successAlert" class="alert alert-success alert-dismissible fade show d-none" role="alert">
            Mensagem enviada com sucesso! Agradecemos o seu contato.
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <form id="contactForm">
            <div class="mb-3">
                <label for="name" class="form-label">Nome Completo</label>
                <input type="text" class="form-control" id="name" placeholder="Seu nome" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Endereço de E-mail</label>
                <input type="email" class="form-control" id="email" placeholder="nome@exemplo.com" required>
            </div>
            <div class="mb-3">
                <label for="subject" class="form-label">Assunto</label>
                <input type="text" class="form-control" id="subject" placeholder="Assunto da mensagem" required>
            </div>
            <div class="mb-3">
                <label for="message" class="form-label">Sua Mensagem</label>
                <textarea class="form-control" id="message" rows="5" placeholder="Digite sua mensagem aqui..." required></textarea>
            </div>
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary btn-lg">Enviar Mensagem</button>
            </div>
        </form>
    </div>

    <!-- Inclua o JavaScript do Bootstrap 5 (bundle com Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script>
        document.getElementById('contactForm').addEventListener('submit', function(event) {
            event.preventDefault(); // Impede o envio padrão do formulário (que recarregaria a página)

            // Esconde qualquer alerta anterior
            document.getElementById('successAlert').classList.add('d-none');

            // Aqui você faria o envio real do formulário (ex: via AJAX)
            // Para este exemplo, apenas simulamos um envio bem-sucedido.
            
            // Exibe o alerta de sucesso
            document.getElementById('successAlert').classList.remove('d-none');

            // Opcional: Limpa os campos do formulário após o envio
            document.getElementById('contactForm').reset();
        });
    </script>
</container>
